name: Release

# VERSION 파일의 버전을 바꿔서 푸시하거나, v* 태그를 푸시하면 릴리즈가 만들어집니다.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리즈 태그 (예: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check batch file uses CRLF
        run: |
          # cmd.exe misreads labels/blocks in LF-only batch files
          if grep -qv $'\r$' LocateMinecraft.bat; then
            echo "LocateMinecraft.bat must use CRLF line endings"; exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 마인크래프트 월드 폴더 찾기 ${{ env.TAG }}
          files: LocateMinecraft.bat
          body: |
            ## 다운로드 및 사용법
            1. 아래 **Assets**에서 `LocateMinecraft.bat`을 내려받습니다.
            2. 내려받은 `LocateMinecraft.bat`을 더블클릭하면 바로 실행됩니다. (압축 해제나 설치 필요 없음)

            자바에디션 · 베드락에디션 · 교육용에디션의 월드 폴더를 찾아 목록으로 보여주고, 더블클릭하면 해당 월드 폴더를 탐색기로 열어줍니다.

            제작: **스티브코딩**

            > 브라우저가 "위험할 수 있는 파일"이라고 경고하면 **유지(계속)** 를 누르세요.
            > Windows SmartScreen 경고가 뜨면 **추가 정보 → 실행**을 누르세요.
